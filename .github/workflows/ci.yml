name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Code Formatting
        run: ruff format --check .

  test-suite:
    name: Automated Tests & Coverage
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Cache DVC Storage / Artifacts
        id: cache-dvc
        uses: actions/cache@v4
        with:
          path: models/credit_risk_model.joblib
          key: model-artifact-${{ hashFiles('models/credit_risk_model.joblib.dvc') }}

      - name: Restore or Train Model Artifact
        run: |
          if [ ! -f "models/credit_risk_model.joblib" ]; then
            echo "Artifact not found in cache. Running deterministic baseline training pipeline..."
            python scripts/train_baseline.py
          else
            echo "Artifact restored successfully from cache."
          fi

      - name: Run Pytest Suite (Unit, Integration, Behavioral)
        run: |
          pytest -v --cov=credit_risk_service --cov-report=term-missing --cov-fail-under=85

  docker-build:
    name: Container Build & Verification
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Model Artifact for Container Context
        run: |
          if [ ! -f "models/credit_risk_model.joblib" ]; then
            python -m pip install -e .
            python scripts/train_baseline.py
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: credit-risk-service:${{ github.sha }}
